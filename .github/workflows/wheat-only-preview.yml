name: Build wheat-only recipe preview

on:
  push:
    paths:
      - ".github/workflows/wheat-only-preview.yml"
      - "tools/make_wheat_only_preview.py"
      - "data/*_goods.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate wheat-only recipe copies
        run: python tools/make_wheat_only_preview.py

      - name: Upload transformed CSV files
        uses: actions/upload-artifact@v4
        with:
          name: wheat-only-recipe-preview
          path: wheat_only_preview/data/*.csv
          if-no-files-found: error
          retention-days: 14
